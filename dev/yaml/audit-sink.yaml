apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-sink
  namespace: default
  labels:
    app: audit-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-sink
  template:
    metadata:
      labels:
        app: audit-sink
    spec:
      containers:
        - name: audit-sink
          image: ko://knative.dev/serving/dev/audit-sink
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd.knative-serving.svc.cluster.local:2379"
            - name: BATCH_SIZE
              value: "50"
            - name: FLUSH_INTERVAL
              value: "500ms"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit-sink
  namespace: default
spec:
  selector:
    app: audit-sink
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
