# Leader strategy: Leader-only replicas with SGX + PRE key management
# Single leader replica per function that handles key distribution
# AKS version: no QCNL volume mounts (Azure provides PCCS)
---
# validate-fun-leader replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: validate-fun-leader
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      containers:
        - image: atosh502/validate-fun:bench
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
      containerConcurrency: 100
---
# vote-fun-leader replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vote-fun-leader
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      containers:
        - image: atosh502/vote-fun:bench
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
      containerConcurrency: 100
---
# count-vote-fun-leader replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: count-vote-fun-leader
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      containers:
        - image: atosh502/count-vote-fun:bench
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
      containerConcurrency: 100
---
# display-fun-leader replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: display-fun-leader
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      containers:
        - image: atosh502/display-fun:bench
          env:
          - name: TYPE
            value: "samples.http.mod3"
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
      containerConcurrency: 100
---
# Sequence for leader strategy
apiVersion: flows.knative.dev/v1
kind: Sequence
metadata:
  name: sequence
  namespace: default
spec:
  channelTemplate:
    apiVersion: messaging.knative.dev/v1
    kind: InMemoryChannel
  steps:
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: validate-fun-leader
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: vote-fun-leader
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: count-vote-fun-leader
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: display-fun-leader
  reply:
    ref:
      kind: Broker
      apiVersion: eventing.knative.dev/v1
      name: broker
