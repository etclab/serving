# Member strategy: Member-only replicas with SGX + PRE re-encryption
# Member replicas that perform proxy re-encryption for the chain
---
# validate-fun-member replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: validate-fun-member
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      volumes:
      - name: sgx-default-qcnl-local-volume
        configMap:
          name: sgx-default-qcnl-local
      containers:
        - image: atosh502/validate-fun:bench
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
          volumeMounts:
            - name: sgx-default-qcnl-local-volume
              mountPath: /etc/sgx_default_qcnl.conf
              subPath: sgx_default_qcnl.conf
      containerConcurrency: 100
---
# vote-fun-member replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vote-fun-member
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      volumes:
      - name: sgx-default-qcnl-local-volume
        configMap:
          name: sgx-default-qcnl-local
      containers:
        - image: atosh502/vote-fun:bench
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
          volumeMounts:
            - name: sgx-default-qcnl-local-volume
              mountPath: /etc/sgx_default_qcnl.conf
              subPath: sgx_default_qcnl.conf
      containerConcurrency: 100
---
# count-vote-fun-member replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: count-vote-fun-member
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      volumes:
      - name: sgx-default-qcnl-local-volume
        configMap:
          name: sgx-default-qcnl-local
      containers:
        - image: atosh502/count-vote-fun:bench
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
          volumeMounts:
            - name: sgx-default-qcnl-local-volume
              mountPath: /etc/sgx_default_qcnl.conf
              subPath: sgx_default_qcnl.conf
      containerConcurrency: 100
---
# display-fun-member replica
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: display-fun-member
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/targetBurstCapacity: "-1"
    spec:
      volumes:
      - name: sgx-default-qcnl-local-volume
        configMap:
          name: sgx-default-qcnl-local
      containers:
        - image: atosh502/display-fun:bench
          env:
          - name: TYPE
            value: "samples.http.mod3"
          resources:
            limits:
              sgx.intel.com/epc: "512Ki"
              sgx.intel.com/enclave: 1
              sgx.intel.com/provision: 1
          volumeMounts:
            - name: sgx-default-qcnl-local-volume
              mountPath: /etc/sgx_default_qcnl.conf
              subPath: sgx_default_qcnl.conf
      containerConcurrency: 100
---
# Sequence for member strategy
apiVersion: flows.knative.dev/v1
kind: Sequence
metadata:
  name: sequence
  namespace: default
spec:
  channelTemplate:
    apiVersion: messaging.knative.dev/v1
    kind: InMemoryChannel
  steps:
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: validate-fun-member
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: vote-fun-member
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: count-vote-fun-member
    - ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: display-fun-member
  reply:
    ref:
      kind: Broker
      apiVersion: eventing.knative.dev/v1
      name: broker
